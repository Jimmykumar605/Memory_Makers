<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Dark Obsidian Background -->
  <rect width="32" height="32" rx="7.5" fill="#040605"/>
  
  <!-- Ambient Inner Glow -->
  <circle cx="16" cy="16.5" r="11" fill="url(#glowGrad)"/>
  
  <!-- Border with emerald gradient -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="url(#brandGrad)" stroke-width="1.5"/>
  
  <!-- Camera Body -->
  <path d="M19 10h-3.2l-1.5 2H10c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7c0-1.1-.9-2-2-2h-1.8l-1.5-2z" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Camera Lens -->
  <circle cx="16" cy="16.5" r="3.2" fill="#040605" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="16" cy="16.5" r="1.3" fill="#34d399"/>
  
  <!-- Viewfinder / flash dot -->
  <circle cx="20.5" cy="13.2" r="0.8" fill="#34d399"/>
</svg>
